<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault — a Wren heist</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03060d;
    background-image: radial-gradient(circle at 50% 38%, #101d31 0%, #050a13 52%, #02040a 100%);
  }
  body { display: grid; place-items: center; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 1120 / 640));
    height: min(100vh, calc(100vw * 640 / 1120));
    background: #070c16;
    box-shadow: 0 0 0 1px rgba(240, 191, 104, 0.22), 0 22px 80px rgba(0, 0, 0, 0.75);
    cursor: crosshair;
    touch-action: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Midnight Vault: guide Wren past sweeping guard and camera cones, take the glowing prize and reach the getaway"></canvas>
<p id="status" role="status" aria-live="polite">Midnight Vault. Move with WASD or arrow keys. Aim and throw tools with the mouse. Crouch with Shift.</p>
<script type="module" src="./js/main.js"></script>
</body>
</html>
